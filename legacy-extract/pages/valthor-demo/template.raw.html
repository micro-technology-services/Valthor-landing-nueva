<style>
  :root{
    --bg:#F7F8FB;
    --panel:#FFFFFF;
    --ink:#0E1525;
    --ink2:#5A6478;
    --ink3:#97A0B3;
    --line:#EAEDF3;
    --line2:#E0E4EC;
    --green:#00C65E;
    --green-soft:#E6FAF0;
    --violet:#7C3AED;
    --violet-soft:#F1ECFE;
    --orange:#FF5B00;
    --orange-soft:#FFEDE4;
    --blue:#2D6BFF;
    --amber:#FFB300;
    --shadow:0 1px 2px rgba(14,21,37,.04),0 4px 16px rgba(14,21,37,.05);
    --shadow-lg:0 8px 40px rgba(14,21,37,.10);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:'Plus Jakarta Sans',sans-serif;
    background:var(--bg);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    font-size:14px;
  }
  .mono{font-family:'DM Mono',monospace}
  #root{height:100vh;overflow:hidden}

  /* layout */
  .app{display:flex;height:100vh}
  .sidebar{
    width:248px;flex-shrink:0;background:var(--panel);
    border-right:1px solid var(--line);
    display:flex;flex-direction:column;padding:20px 14px;
  }
  .main{flex:1;overflow-y:auto;display:flex;flex-direction:column}
  .topbar{
    height:64px;flex-shrink:0;border-bottom:1px solid var(--line);
    background:rgba(255,255,255,.8);backdrop-filter:blur(8px);
    display:flex;align-items:center;justify-content:space-between;
    padding:0 28px;position:sticky;top:0;z-index:10;
  }
  .content{padding:28px;flex:1}

  /* brand */
  .brand{display:flex;align-items:center;gap:10px;padding:6px 8px 22px}
  .brand-mark{
    width:34px;height:34px;border-radius:10px;flex-shrink:0;
    background:linear-gradient(135deg,#00C65E,#00A8C6);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 4px 12px rgba(0,198,94,.35);position:relative;
  }
  .brand-mark::before,.brand-mark::after{
    content:"";position:absolute;width:5px;height:5px;border-radius:50%;
    background:#fff;top:12px;
  }
  .brand-mark::before{left:10px}
  .brand-mark::after{left:19px}
  .brand-name{font-weight:800;font-size:19px;letter-spacing:-.02em}
  .brand-name b{color:var(--green)}

  /* nav */
  .nav-label{font-size:10.5px;font-weight:700;letter-spacing:.08em;color:var(--ink3);
    text-transform:uppercase;padding:14px 10px 8px}
  .nav-item{
    display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:9px;
    color:var(--ink2);font-weight:600;cursor:pointer;font-size:13.5px;
    transition:all .14s;margin-bottom:2px;border:1px solid transparent;
  }
  .nav-item:hover{background:var(--bg);color:var(--ink)}
  .nav-item.active{background:var(--green-soft);color:#03894a;border-color:#CFF3E1}
  .nav-item.active .ni-ico{color:var(--green)}
  .nav-item.ventas.active{background:var(--violet-soft);color:#5b22c4;border-color:#E4D8FC}
  .nav-item.ventas.active .ni-ico{color:var(--violet)}
  .ni-ico{width:18px;height:18px;flex-shrink:0;color:var(--ink3)}
  .ni-badge{margin-left:auto;font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px;
    background:var(--orange-soft);color:var(--orange)}

  .side-spacer{flex:1}
  .plan-card{
    background:linear-gradient(135deg,#0E1525,#1d2842);border-radius:13px;padding:14px;color:#fff;
  }
  .plan-card .pc-top{display:flex;align-items:center;gap:8px;font-size:11px;color:#9fb0d0;font-weight:600;letter-spacing:.04em}
  .plan-card .pc-name{font-weight:800;font-size:15px;margin:6px 0 3px}
  .plan-card .pc-sub{font-size:11.5px;color:#8a9ab8;line-height:1.4}
  .pc-btn{margin-top:11px;width:100%;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);
    color:#fff;border-radius:8px;padding:7px;font-weight:600;font-size:12px;cursor:pointer;font-family:inherit}
  .pc-btn:hover{background:rgba(255,255,255,.18)}

  /* topbar */
  .ws-switch{display:flex;align-items:center;gap:10px;cursor:pointer;padding:6px 10px;border-radius:9px;border:1px solid var(--line)}
  .ws-switch:hover{background:var(--bg)}
  .ws-avatar{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;
    font-weight:800;font-size:11px;color:#fff}
  .ws-meta b{font-size:13px;display:block;line-height:1.1}
  .ws-meta span{font-size:11px;color:var(--ink3)}
  .tb-right{display:flex;align-items:center;gap:14px}
  .credits-pill{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);
    border-radius:20px;padding:6px 13px;font-weight:700;font-size:12.5px}
  .credits-pill .dot{width:7px;height:7px;border-radius:50%;background:var(--green)}
  .av{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#7C3AED,#00C65E);
    display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:13px}

  /* page heading */
  .ph{margin-bottom:22px}
  .ph h1{font-size:24px;font-weight:800;letter-spacing:-.02em}
  .ph p{color:var(--ink2);font-size:14px;margin-top:3px}
  .ph-flex{display:flex;align-items:flex-end;justify-content:space-between;gap:16px}

  /* cards / grid */
  .grid{display:grid;gap:16px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow)}
  .pad{padding:18px}

  /* KPI hero */
  .hero-kpis{grid-template-columns:repeat(4,1fr)}
  .kpi{position:relative;overflow:hidden}
  .kpi .pad{padding:18px}
  .kpi-ico{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;margin-bottom:14px}
  .kpi-label{font-size:11.5px;font-weight:700;letter-spacing:.04em;color:var(--ink3);text-transform:uppercase}
  .kpi-val{font-size:30px;font-weight:800;letter-spacing:-.02em;margin-top:5px;line-height:1}
  .kpi-sub{font-size:12px;color:var(--ink2);margin-top:8px;display:flex;align-items:center;gap:5px}
  .trend-up{color:var(--green);font-weight:700}
  .kpi-spark{position:absolute;right:0;bottom:0;opacity:.5}

  /* feed */
  .section-title{font-size:13px;font-weight:800;letter-spacing:-.01em;margin-bottom:13px;display:flex;align-items:center;gap:8px}
  .live-dot{width:8px;height:8px;border-radius:50%;background:var(--green);position:relative}
  .live-dot::after{content:"";position:absolute;inset:-4px;border-radius:50%;background:var(--green);opacity:.3;animation:pulse 1.8s infinite}
  @keyframes pulse{0%{transform:scale(.8);opacity:.4}100%{transform:scale(2.2);opacity:0}}
  .feed-item{display:flex;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
  .feed-item:last-child{border-bottom:none;padding-bottom:0}
  .feed-ico{width:34px;height:34px;border-radius:9px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:15px}
  .feed-body{flex:1}
  .feed-body .ft{font-size:13.5px;font-weight:600;line-height:1.4}
  .feed-body .ft b{font-weight:700}
  .feed-body .fm{font-size:12px;color:var(--ink3);margin-top:2px}
  .feed-amount{font-weight:800;font-size:13.5px;color:var(--green);white-space:nowrap}

  /* chat */
  .chat-wrap{display:grid;grid-template-columns:300px 1fr 280px;height:calc(100vh - 64px - 56px);gap:0;
    border:1px solid var(--line);border-radius:15px;overflow:hidden;background:var(--panel);box-shadow:var(--shadow)}
  .chat-list{border-right:1px solid var(--line);overflow-y:auto}
  .chat-list-head{padding:15px 16px;border-bottom:1px solid var(--line)}
  .chat-search{width:100%;border:1px solid var(--line2);background:var(--bg);border-radius:9px;padding:8px 12px;
    font-family:inherit;font-size:13px;color:var(--ink)}
  .chat-filters{display:flex;gap:6px;margin-top:11px}
  .chip{font-size:11px;font-weight:600;padding:4px 10px;border-radius:20px;background:var(--bg);color:var(--ink2);
    border:1px solid var(--line);cursor:pointer}
  .chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .conv{display:flex;gap:11px;padding:13px 16px;border-bottom:1px solid var(--line);cursor:pointer;position:relative}
  .conv:hover{background:var(--bg)}
  .conv.sel{background:var(--green-soft)}
  .conv.sel::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--green)}
  .conv-av{width:38px;height:38px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;
    color:#fff;font-weight:700;font-size:13px;position:relative}
  .ch-badge{position:absolute;bottom:-2px;right:-2px;width:16px;height:16px;border-radius:50%;border:2px solid #fff;
    display:flex;align-items:center;justify-content:center;font-size:8px}
  .ch-multi{position:absolute;bottom:-4px;right:-6px;display:flex}
  .chm{width:16px;height:16px;border-radius:50%;border:2px solid #fff;display:flex;align-items:center;justify-content:center;font-size:8px;margin-left:-5px}
  .tag.link{background:#EAF1FF;color:#2052cc}
  .unified-bar{display:flex;align-items:center;gap:10px;padding:11px 18px;background:#EAF1FF;border-bottom:1px solid #D4E0F7;
    font-size:12.5px;color:#1f47a8;line-height:1.45}
  .unified-bar svg{flex-shrink:0;color:#2052cc}
  .conv-main{flex:1;min-width:0}
  .conv-top{display:flex;justify-content:space-between;align-items:center}
  .conv-name{font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .conv-time{font-size:10.5px;color:var(--ink3);flex-shrink:0;margin-left:6px}
  .conv-prev{font-size:12px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
  .conv-tags{display:flex;gap:5px;margin-top:6px}
  .tag{font-size:9.5px;font-weight:700;padding:2px 7px;border-radius:5px}
  .tag.ia{background:var(--violet-soft);color:var(--violet)}
  .tag.hot{background:var(--orange-soft);color:var(--orange)}
  .tag.won{background:var(--green-soft);color:#03894a}

  .chat-conv{display:flex;flex-direction:column;background:#FAFBFD}
  .chat-head{padding:13px 18px;border-bottom:1px solid var(--line);background:var(--panel);display:flex;align-items:center;justify-content:space-between}
  .chat-head-l{display:flex;align-items:center;gap:11px}
  .ia-toggle{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:#03894a;
    background:var(--green-soft);border:1px solid #CFF3E1;padding:6px 12px;border-radius:20px}
  .ia-toggle .sw{width:30px;height:17px;background:var(--green);border-radius:20px;position:relative}
  .ia-toggle .sw::after{content:"";position:absolute;width:13px;height:13px;background:#fff;border-radius:50%;top:2px;right:2px}
  .chat-body{flex:1;overflow-y:auto;padding:22px;display:flex;flex-direction:column;gap:13px}
  .msg{max-width:72%;padding:10px 14px;border-radius:14px;font-size:13.5px;line-height:1.5}
  .msg.in{align-self:flex-start;background:#fff;border:1px solid var(--line);border-bottom-left-radius:4px}
  .msg.out{align-self:flex-end;background:var(--green);color:#fff;border-bottom-right-radius:4px}
  .msg-time{font-size:10px;margin-top:5px;opacity:.7}
  .msg.out .msg-time{text-align:right}
  .day-sep{align-self:center;font-size:11px;color:var(--ink3);background:var(--bg);padding:3px 12px;border-radius:20px;font-weight:600}
  .prod-card{align-self:flex-end;max-width:72%;background:#fff;border:1px solid var(--line);border-radius:14px;
    border-bottom-right-radius:4px;overflow:hidden;box-shadow:var(--shadow)}
  .prod-card .pc-img{height:120px;background:linear-gradient(135deg,#1a1f2e,#2d3548);display:flex;align-items:center;justify-content:center;font-size:38px}
  .prod-card .pc-info{padding:11px 13px}
  .prod-card .pc-t{font-weight:700;font-size:13px}
  .prod-card .pc-p{font-weight:800;font-size:15px;color:var(--green);margin-top:3px}
  .pay-card{align-self:flex-end;max-width:72%;background:linear-gradient(135deg,#0E1525,#1d2842);color:#fff;
    border-radius:14px;border-bottom-right-radius:4px;padding:14px 16px}
  .pay-card .py-t{font-size:11px;color:#9fb0d0;font-weight:600;letter-spacing:.04em}
  .pay-card .py-a{font-size:22px;font-weight:800;margin:4px 0 10px}
  .pay-card .py-btn{background:var(--green);color:#fff;border:none;border-radius:8px;padding:9px;width:100%;font-weight:700;font-size:13px;font-family:inherit}
  .chat-input{padding:14px 18px;border-top:1px solid var(--line);background:var(--panel);display:flex;gap:10px;align-items:center}
  .chat-input input{flex:1;border:1px solid var(--line2);border-radius:10px;padding:10px 14px;font-family:inherit;font-size:13.5px}
  .ci-send{width:40px;height:40px;border-radius:10px;background:var(--green);border:none;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center}

  .wsx-slug{font-size:11.5px;color:var(--ink3)}

  .kcol-head .kc{font-size:11px;font-weight:700;color:var(--ink3);background:var(--panel);padding:1px 8px;border-radius:20px;border:1px solid var(--line)}

  .fade{animation:fade .3s ease}

  .auto-sec h3{font-size:16px;font-weight:800}
  .auto-sec p{font-size:12.5px;color:var(--ink2)}
  .rule{display:flex;align-items:center;gap:14px;padding:16px 18px;margin-bottom:11px}
  .rule-ico{width:38px;height:38px;border-radius:10px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
  .rule-body{flex:1}

  .rule-sw.off{background:var(--line2)}

  .nl-input{background:var(--violet-soft);border:1px solid #E4D8FC;border-radius:12px;padding:14px 16px;margin-bottom:18px;display:flex;align-items:center;gap:12px}

  .nl-input input{flex:1;background:#fff;border:1px solid #E4D8FC;border-radius:9px;padding:10px 13px;font-family:inherit;font-size:13.5px;color:var(--ink)}

  .handoff-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 16px;
    border:1px solid var(--line);border-radius:11px;margin-bottom:10px;font-size:13.5px;font-weight:600;color:var(--ink)}

  .ct-btn.primary{background:var(--violet);color:#fff;border-color:var(--violet)}

  .ficha-overlay{position:fixed;inset:0;background:rgba(10,15,28,.45);backdrop-filter:blur(3px);z-index:200;
